# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        pandas: ["latest"]
        include:
          # setup.py declares pandas>=2.0.0, but every interpreter we still
          # support resolves to pandas 3.x. This job keeps the 2.x half of that
          # declared floor tested - tests/unit/test_pandas_compat.py exists for
          # exactly this drift.
          - python-version: "3.11"
            pandas: "2.x"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
        if [ "${{ matrix.pandas }}" = "2.x" ]; then python -m pip install "pandas<3"; fi
    - name: Show environment
      run: |
        python -c "import sys, pandas, numpy, scipy; print('python', sys.version.split()[0]); print('pandas', pandas.__version__); print('numpy', numpy.__version__); print('scipy', scipy.__version__)"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
