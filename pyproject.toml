[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baseTs"
dynamic = ["version"]
description = "A Python library for time series analysis, filtering, and outlier detection"
readme = "README.md"
license = "MIT"
authors = [{name = "Stan Colcombe", email = "stan@sympaticog.com"}]
requires-python = ">=3.11"
keywords = ["time series", "filtering", "outlier detection", "FFT", "signal processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.19.0",
    "scipy>=1.5.0",
    "pandas>=3.0.0",
    "matplotlib>=3.0.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
parquet = [
    "pyarrow>=14.0",
]
dev = [
    "pytest>=6.0",
    "hypothesis>=6.0",
    "psutil>=5.0",
    "black>=22.0",
    "isort>=5.0",
    "mypy>=0.910",
    "flake8>=4.0",
    "pyarrow>=14.0",
]

[project.urls]
Homepage = "https://github.com/SympatiCog/baseTs"
"Bug Reports" = "https://github.com/SympatiCog/baseTs/issues"
Source = "https://github.com/SympatiCog/baseTs"
Documentation = "https://github.com/SympatiCog/baseTs/blob/main/docs/"

[tool.setuptools.dynamic]
version = {attr = "baseTs.version.__version__"}

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.package-data]
baseTs = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
